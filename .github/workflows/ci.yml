name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: server and CLI (Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6.4.1
      # Format check, compile with warnings as errors, unit tests, and
      # integration tests against PostgreSQL, Redis and Kafka in Docker.
      - name: Build and test
        run: ./gradlew build
      - name: API docs from the tests
        run: ./gradlew :server:asciidoctor
      - name: Keep the API docs
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-docs
          path: server/build/docs/asciidoc

  dashboard:
    name: dashboard (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
