spring:
  application:
    name: schedkeel
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SCHEDKEEL_DB_URL:jdbc:postgresql://localhost:5432/schedkeel}
    username: ${SCHEDKEEL_DB_USER:schedkeel}
    password: ${SCHEDKEEL_DB_PASSWORD:schedkeel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      url: ${SCHEDKEEL_REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${SCHEDKEEL_KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: schedkeel
      auto-offset-reset: earliest
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  session:
    timeout: 8h
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, modulith
  endpoint:
    health:
      probes:
        enabled: true

schedkeel:
  kafka:
    trigger-topic: schedkeel.triggers
    run-events-topic: schedkeel.run-events
  security:
    users:
      - username: admin
        password: ${SCHEDKEEL_ADMIN_PASSWORD:}
        roles: [ADMIN]
      - username: viewer
        password: ${SCHEDKEEL_VIEWER_PASSWORD:}
        roles: [VIEWER]
